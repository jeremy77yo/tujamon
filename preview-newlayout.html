  <style>
    /* ──────────────────────────────────────────────────────────────
       PREVIEW v3 — Tyler Mitchell flavor.
       One flat grid. Density toggle is the headline interaction at top.
       Default = dense (wall of stamps). Years live only in the lightbox
       caption — not in the layout. Hover focus + click-to-enlarge stay.
       ────────────────────────────────────────────────────────────── */

    .preview-banner {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #2a1d2a;
      color: #ece2d7;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      padding: 10px 16px;
    }

    /* — Control bar at top — */
    .archive-bar {
      max-width: 1600px;
      margin: 28px auto 24px;
      padding: 0 32px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      font-family: "Space Grotesk", sans-serif;
      flex-wrap: wrap;
    }
    @media (max-width: 720px) {
      .archive-bar { padding: 0 16px; margin-top: 20px; }
    }

    .archive-bar-left {
      display: flex;
      align-items: baseline;
      gap: 24px;
    }
    .archive-count {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #968096;
      font-variant-numeric: tabular-nums;
    }
    .archive-count strong {
      color: #2a1d2a;
      font-weight: 500;
    }

    /* Density toggle — headline interaction */
    .density-bar {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #968096;
    }
    .density-bar-label {
      margin-right: 8px;
      color: #968096;
    }
    .density-bar button {
      background: none;
      border: none;
      padding: 6px 10px;
      cursor: pointer;
      color: #968096;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      transition: color 0.2s ease, background 0.2s ease;
      font-variant-numeric: tabular-nums;
    }
    .density-bar button:hover { color: #2a1d2a; }
    .density-bar button.active {
      color: #ece2d7;
      background: #2a1d2a;
    }

    /* — One flat grid — */
    .archive {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 32px 80px;
    }
    @media (max-width: 720px) {
      .archive { padding: 0 16px 60px; }
    }

    .archive-grid {
      display: grid;
      gap: 8px;
    }
    .archive[data-density="50"] .archive-grid {
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .archive[data-density="200"] .archive-grid {
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .archive[data-density="500"] .archive-grid {
      grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
      gap: 4px;
    }

    /* — Tile — */
    .tile {
      display: block;
      cursor: zoom-in;
      transition: transform 0.32s cubic-bezier(0.2, 0.7, 0.2, 1),
                  filter 0.32s ease,
                  opacity 0.32s ease;
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f4ece2;
    }
    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .archive-grid:hover .tile {
      filter: saturate(0.6) brightness(0.94);
      opacity: 0.5;
    }
    .archive-grid .tile:hover {
      filter: saturate(1.05) brightness(1.02);
      opacity: 1;
      transform: scale(1.04);
      z-index: 2;
    }
    .archive[data-density="500"] .tile:hover {
      transform: scale(1.18);  /* tiny tiles need a bigger pop on hover */
    }

    /* — Lightbox — */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(20, 14, 20, 0.92);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 40px;
      opacity: 0;
      transition: opacity 0.28s ease;
    }
    .lightbox.open { display: flex; opacity: 1; }
    .lightbox-inner {
      position: relative;
      max-width: 92vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .lightbox-img {
      max-width: 92vw;
      max-height: 78vh;
      width: auto;
      height: auto;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      background: #ece2d7;
    }
    .lightbox-caption {
      color: #ece2d7;
      font-family: "Space Grotesk", sans-serif;
      font-size: 13px;
      letter-spacing: 0.04em;
      display: flex;
      gap: 24px;
      align-items: center;
      opacity: 0.85;
    }
    .lightbox-caption .lb-year {
      color: #a89cab;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .lightbox-caption a {
      color: #d4b5d4;
      text-decoration: none;
      border-bottom: 1px solid rgba(212, 181, 212, 0.5);
      padding-bottom: 1px;
    }
    .lb-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #ece2d7;
      font-size: 36px;
      font-family: "EB Garamond", serif;
      cursor: pointer;
      padding: 12px 18px;
      opacity: 0.55;
      transition: opacity 0.2s ease;
      line-height: 1;
    }
    .lb-btn:hover { opacity: 1; }
    .lb-prev { left: -8px; }
    .lb-next { right: -8px; }
    .lb-close {
      position: absolute;
      top: 20px; right: 24px;
      background: none; border: none;
      color: #ece2d7; font-size: 32px;
      cursor: pointer; opacity: 0.6;
      line-height: 1; padding: 4px 8px;
      font-family: "Space Grotesk", sans-serif;
    }
    .lb-close:hover { opacity: 1; }
    .lb-counter {
      position: absolute;
      top: 24px; left: 28px;
      color: #ece2d7;
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.55;
    }
    @media (max-width: 720px) {
      .lightbox { padding: 16px; }
      .lb-prev, .lb-next { font-size: 28px; padding: 8px 12px; }
      .lb-prev { left: 0; }
      .lb-next { right: 0; }
    }
  </style>

<!-- ── Lightbox ── -->
<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Artwork viewer">
  <button class="lb-close" id="lbClose" aria-label="Close">×</button>
  <span class="lb-counter" id="lbCounter">1 / 30</span>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous">‹</button>
  <div class="lightbox-inner">
    <img class="lightbox-img" id="lbImg" src="" alt="" />
    <div class="lightbox-caption">
      <span id="lbTitle">Title</span>
      <span class="lb-year" id="lbYear">2026</span>
      <a id="lbLink" href="#">view full page →</a>
    </div>
  </div>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next">›</button>
</div>

<script>
(function() {
  var archive = document.getElementById('archive');
  var tiles = Array.from(document.querySelectorAll('.tile'));
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lbImg');
  var lbTitle = document.getElementById('lbTitle');
  var lbYear = document.getElementById('lbYear');
  var lbLink = document.getElementById('lbLink');
  var lbCounter = document.getElementById('lbCounter');
  var idx = 0;

  function open(i) {
    idx = (i + tiles.length) % tiles.length;
    var t = tiles[idx];
    var img = t.querySelector('img');
    lbImg.src = img.src;
    lbImg.alt = img.alt;
    lbTitle.textContent = t.dataset.title || img.alt;
    lbYear.textContent = t.dataset.year || '';
    lbLink.href = t.getAttribute('href');
    lbCounter.textContent = (idx + 1) + ' / ' + tiles.length;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function close() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  function next() { open(idx + 1); }
  function prev() { open(idx - 1); }

  tiles.forEach(function(t, i) {
    t.addEventListener('click', function(e) { e.preventDefault(); open(i); });
  });

  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbNext').addEventListener('click', next);
  document.getElementById('lbPrev').addEventListener('click', prev);
  lb.addEventListener('click', function(e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function(e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
  });

  // Density toggle
  var densityBtns = document.querySelectorAll('.density-bar button');
  densityBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var d = btn.dataset.density;
      archive.dataset.density = d;
      densityBtns.forEach(function(b) { b.classList.toggle('active', b === btn); });
    });
  });
})();
</script>
